# ============== DEPLOYMENT VARIABLES ============================
INTERNAL_TLS_ENABLED: false
MONITORING_ENABLED: true
CLOUD_TOPOLOGY_KEY: kubernetes.io/hostname
READONLY_CONTAINER_FILE_SYSTEM_ENABLED: true

#=============== GATEWAY HPA VARIABLES ==========================
GATEWAY_HPA_MIN_REPLICAS: 1
GATEWAY_HPA_MAX_REPLICAS: 9999
GATEWAY_HPA_AVERAGE_UTILIZATION_TARGET_PERCENT: 75
GATEWAY_HPA_SELECT_POLICY: Disabled
GATEWAY_HPA_SCALE_UP_STABILIZATION_WINDOW_SECONDS: 60
GATEWAY_HPA_SCALE_UP_PERCENT_VALUE: -1
GATEWAY_HPA_SCALE_UP_PERCENT_PERIOD_SECONDS: -1
GATEWAY_HPA_SCALE_UP_PODS_VALUE: 1
GATEWAY_HPA_SCALE_UP_PODS_PERIOD_SECONDS: 60
GATEWAY_HPA_SCALE_DOWN_STABILIZATION_WINDOW_SECONDS: 300
GATEWAY_HPA_SCALE_DOWN_PERCENT_VALUE: -1
GATEWAY_HPA_SCALE_DOWN_PERCENT_PERIOD_SECONDS: -1
GATEWAY_HPA_SCALE_DOWN_PODS_VALUE: 1
GATEWAY_HPA_SCALE_DOWN_PODS_PERIOD_SECONDS: 60

# ============== SERVICE VARIABLES ============================
LOG_LEVEL: "info"

TRACING_ENABLED: false
TRACING_HOST: 'nc-diagnostic-agent'
TRACING_SAMPLER_RATELIMITING: 10

GOGC: "20"

IP_STACK: "v4"
MAX_CONCURRENT_RECONCILES: 7
XDS_CLUSTER_HOST: control-plane
XDS_CLUSTER_PORT: 15010
ISSUER_GROUP: 'cert-manager.io'
ISSUER_KIND: 'ClusterIssuer'
ISSUER_NAME: ''
X509_AUTHENTICATION_ENABLED: false
GW_INGRESS_ANNOTATIONS: ''
FACADE_GATEWAY_TERMINATION_GRACE_PERIOD_S: 60
PEER_NAMESPACE: ''
INGRESS_CLASS: ''
K8S_SERVICE_TYPE: 'CLUSTER_IP'
SERVICE_MESH_TYPE: 'Core'
CONSUL_ENABLED: false
CONSUL_URL: ''
GATEWAY_SYSTEM_TYPE: 'legacy-ingress'
GATEWAY_SYSTEM_NAMESPACE: 'gateway-system'
GATEWAY_SYSTEM_NAME: 'default-external-gateway'
CONTROLLER_NAMESPACE: ''
# Idle timeout between backend reads/writes for Gateway API HTTPRoute, for example, "1800s".
HTTP_ROUTE_REQUEST_IDLE_TIMEOUT: ''
# Additional filters to add to Gateway API HTTPRoute rules. Could be used, for example, to modify response headers.
HTTP_ROUTE_CUSTOM_FILTERS: []
DEPLOYMENT_STRATEGY_TYPE: recreate
M2M_AUTH_MODE: 'legacy' # Options: legacy, hybrid, k8s
